<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Álbum no disponible</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
        }
        main { max-width: 420px; }
        .icon { font-size: 3rem; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; line-height: 1.5; }
        a { display: inline-block; margin-top: 20px; color: #c4b5fd; }
    </style>
</head>
<body>
<main>
    <div class="icon">📷</div>
    <h1>Este álbum ya no está disponible.</h1>
    <p>Terminó el período de guardado de las fotos y los mensajes de este evento.</p>
    <a th:if="${organizer}" href="/admin/eventos">Volver a Mis eventos</a>
</main>
</body>
</html>
