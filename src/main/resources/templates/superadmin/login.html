<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{superadmin/nav :: head('Iniciar sesión')}"></head>
<body class="solo">

<main>
    <form id="loginForm" class="form">
        <span class="mark" aria-hidden="true"></span>
        <h1>Superadmin</h1>
        <p>Panel interno de EventFoto.</p>

        <div id="alertError" class="notice" role="status"></div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="btnSubmit" class="btn btn-primary">Ingresar</button>
    </form>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertError = document.getElementById('alertError');
        const btnSubmit = document.getElementById('btnSubmit');
        alertError.className = 'notice';
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Ingresando...';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/v1/superadmin/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                window.location.href = '/superadmin/eventos';
            } else {
                const errData = await response.json().catch(() => ({}));
                alertError.innerText = errData.message || 'Email o contraseña incorrectos.';
                alertError.className = 'notice err';
            }
        } catch (err) {
            alertError.innerText = 'Error de conexión con el servidor.';
            alertError.className = 'notice err';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Ingresar';
        }
    });
</script>
</body>
</html>
