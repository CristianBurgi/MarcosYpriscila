<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear evento sin costo — Superadmin EventFoto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-purple: #c084fc;
            --accent-amber: #fbbf24;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; color: var(--text-primary); }
        .card { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; width: 100%; max-width: 560px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem; outline: none; resize: vertical; font-family: inherit; }
        .form-control:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.25); }
        .btn-submit { width: 100%; padding: 14px; margin-top: 10px; background: linear-gradient(135deg, #f59e0b, #8b5cf6); border: none; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { display: none; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 20px; }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .result { display: none; margin-top: 28px; padding: 20px; border-radius: 16px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
        .result h2 { font-size: 1.05rem; margin-bottom: 10px; color: #6ee7b7; }
        .result p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }
        .link-box { display: flex; gap: 8px; margin-top: 12px; }
        .link-box input { flex: 1; padding: 10px 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text-primary); font-size: 0.85rem; }
        .link-box button { padding: 10px 16px; border: none; border-radius: 10px; background: var(--accent-purple); color: #1e1b4b; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>Crear evento sin costo</h1>
    <p class="subtitle">Para un familiar o un caso puntual. Si el email ya tiene cuenta, el evento se suma a sus eventos existentes.</p>

    <div id="alertError" class="alert alert-error"></div>

    <form id="freeEventForm">
        <div class="form-group">
            <label for="email">Email de quien va a usar el evento</label>
            <input type="email" id="email" class="form-control" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="eventName">Nombre del evento</label>
            <input type="text" id="eventName" class="form-control" placeholder="Cumpleaños de..." required>
        </div>
        <div class="form-group">
            <label for="reason">Motivo de la cortesía</label>
            <textarea id="reason" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" id="btnSubmit" class="btn-submit">Crear evento</button>
    </form>

    <div id="result" class="result">
        <h2 id="resultTitle"></h2>
        <p id="resultSlug"></p>
        <p id="resultOrganizer"></p>
        <div id="linkSection" style="display:none">
            <p>Link de activación (copiar y mandar por WhatsApp — vence en 7 días):</p>
            <div class="link-box">
                <input type="text" id="activationLink" readonly>
                <button type="button" id="btnCopy">Copiar</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('freeEventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertError = document.getElementById('alertError');
        const result = document.getElementById('result');
        const btnSubmit = document.getElementById('btnSubmit');
        alertError.style.display = 'none';
        result.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Creando...';

        const email = document.getElementById('email').value;
        const eventName = document.getElementById('eventName').value;
        const reason = document.getElementById('reason').value;

        try {
            const response = await fetch('/api/v1/superadmin/events/free-event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, eventName, reason })
            });

            const data = await response.json().catch(() => ({}));

            if (response.ok) {
                document.getElementById('resultTitle').innerText = `Evento "${data.eventName}" creado`;
                document.getElementById('resultSlug').innerText = `Slug: ${data.slug}`;
                document.getElementById('resultOrganizer').innerText = data.newOrganizer
                    ? `Cuenta nueva creada para ${data.organizerEmail}`
                    : `Se sumó a la cuenta existente de ${data.organizerEmail}`;

                const linkSection = document.getElementById('linkSection');
                if (data.activationLink) {
                    linkSection.style.display = 'block';
                    document.getElementById('activationLink').value = data.activationLink;
                } else {
                    linkSection.style.display = 'none';
                }
                result.style.display = 'block';
                e.target.reset();
            } else {
                alertError.innerText = data.message || 'No se pudo crear el evento.';
                alertError.style.display = 'block';
            }
        } catch (err) {
            alertError.innerText = 'Error de conexión con el servidor.';
            alertError.style.display = 'block';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Crear evento';
        }
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
        const input = document.getElementById('activationLink');
        input.select();
        navigator.clipboard.writeText(input.value).catch(() => document.execCommand('copy'));
    });
</script>
</body>
</html>
