<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{superadmin/nav :: head('Crear evento sin costo')}"></head>
<body>

<nav th:replace="~{superadmin/nav :: nav('nuevo')}"></nav>

<main>
    <div class="head">
        <div>
            <h1>Crear evento sin costo</h1>
            <p>Para un familiar o un caso puntual. Si el email ya tiene cuenta, el evento se suma a sus eventos.</p>
        </div>
    </div>

    <form id="freeEventForm" class="form">
        <div id="alert" class="notice" role="status"></div>
        <div class="field">
            <label for="email">Email de quien va a usar el evento</label>
            <input type="email" id="email" required autocomplete="off">
        </div>
        <div class="field">
            <label for="eventName">Nombre del evento</label>
            <input type="text" id="eventName" placeholder="Cumpleaños de..." required maxlength="255">
        </div>
        <div class="field">
            <label for="reason">Motivo de la cortesía</label>
            <textarea id="reason" rows="3" required></textarea>
            <p class="hint">Queda guardado junto al evento y se ve en el listado.</p>
        </div>
        <button type="submit" id="btnSubmit" class="btn btn-primary">Crear evento</button>
    </form>
</main>

<script src="/js/superadmin.js?v=1"></script>
<script>
    document.getElementById('freeEventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alert = document.getElementById('alert');
        const btnSubmit = document.getElementById('btnSubmit');
        const show = (kind, ...nodes) => { alert.className = 'notice ' + kind; alert.replaceChildren(...nodes); };
        const p = text => Object.assign(document.createElement('p'), {textContent: text});
        alert.className = 'notice';
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Creando...';

        const email = document.getElementById('email').value;
        const eventName = document.getElementById('eventName').value;
        const reason = document.getElementById('reason').value;

        try {
            const response = await fetch('/api/v1/superadmin/events/free-event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, eventName, reason })
            });

            const data = await response.json().catch(() => ({}));

            if (response.status === 401) {
                location.href = '/superadmin/login';
            } else if (response.ok) {
                const nodes = [
                    p(`Evento "${data.eventName}" creado (slug ${data.slug}).`),
                    p(data.newOrganizer ? `Cuenta nueva para ${data.organizerEmail}.` : `Se sumó a la cuenta de ${data.organizerEmail}.`)
                ];
                if (data.activationLink) {
                    nodes.push(linkBox('Link de activación (mandalo por WhatsApp, vence en 7 días):', data.activationLink));
                }
                // Antes de mostrar el aviso: reset() también vaciaría el input del link, que está dentro del form.
                e.target.reset();
                show('ok', ...nodes);
            } else {
                show('err', p(data.message || 'No se pudo crear el evento.'));
            }
        } catch (err) {
            show('err', p('Error de conexión con el servidor.'));
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Crear evento';
        }
    });
</script>
</body>
</html>
