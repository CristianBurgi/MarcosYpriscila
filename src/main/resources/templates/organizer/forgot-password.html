<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — EventFoto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
    <style>
        /* Paleta "Etiqueta", la misma de la landing y del panel del organizador. */
        :root {
            --smoking: #1C1A1F;
            --surface: #252329;
            --line: rgba(244, 242, 238, 0.10);
            --line-strong: rgba(244, 242, 238, 0.22);
            --champan: #D9C29A;
            --text-main: #F4F2EE;
            --text-sub: #A39FA8;
            --ok: #9CCBA5;
            --danger: #E9A0A0;
            --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--smoking); min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 32px 16px; color: var(--text-main); font: 400 1rem/1.5 'Atkinson Hyperlegible', system-ui, sans-serif; }
        button, input { font-family: inherit; }
        :focus-visible { outline: 3px solid var(--champan); outline-offset: 2px; }
        .card, .login-card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px;
            padding: 36px 32px; width: 100%; max-width: 420px; }
        .header, .login-header { display: flex; flex-direction: column; margin-bottom: 26px; }
        /* La marca: el aro de la landing. En el login es el "EventFoto" del encabezado, que sube arriba del título. */
        .brand, .login-header p { display: flex; align-items: center; gap: 10px; font: 800 1.5rem/1 var(--display); color: var(--text-main); margin-bottom: 22px; }
        .login-header p { order: -1; }
        .login-header p::before, .logo-mark { content: ""; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--champan); flex-shrink: 0;
            background: radial-gradient(circle, var(--champan) 0 3px, transparent 3.5px); }
        h1 { font: 800 clamp(2.2rem, 9vw, 2.8rem)/1 var(--display); margin-bottom: 10px; }
        .header p:not(.brand) { color: var(--text-sub); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line-strong);
            background: var(--smoking); color: var(--text-main); font-size: 1rem; }
        .form-control::placeholder { color: var(--text-sub); opacity: 1; }
        .form-control:hover { border-color: var(--text-sub); }
        .btn-submit { width: 100%; padding: 13px 20px; margin-top: 8px; background: var(--champan); border: 0; color: var(--smoking);
            border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 1rem; }
        .btn-submit:hover { background: #E6D3B0; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert, .alert-error { display: none; padding: 12px 14px; border: 1px solid currentColor; border-radius: 8px; font-size: 0.95rem; margin-bottom: 20px; }
        .alert-error { color: var(--danger); }
        .alert-success { color: var(--ok); }
        .success-view { display: none; text-align: center; }
        .success-view a { display: inline-block; margin-top: 12px; color: var(--champan); font-weight: 700; }
        a { color: var(--champan); }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        @media (max-width: 480px) { .card, .login-card { padding: 28px 20px; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <p class="brand"><i class="logo-mark" aria-hidden="true"></i> EventFoto</p>
        <h1>¿Olvidaste tu contraseña?</h1>
        <p>Escribí el email de tu cuenta y te mandamos un link para elegir una nueva</p>
    </div>

    <div id="alertError" class="alert alert-error"></div>

    <form id="forgotForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="tu@email.com" required maxlength="254" autocomplete="email">
        </div>
        <button type="submit" id="btnSubmit" class="btn-submit">Mandarme el link</button>
    </form>

    <div id="successView" class="success-view">
        <div id="successText" class="alert alert-success" style="display:block"></div>
        <a href="/admin/login">Volver a iniciar sesión</a>
    </div>
</div>

<script>
    const form = document.getElementById('forgotForm');
    const alertError = document.getElementById('alertError');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertError.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Enviando...';

        try {
            const response = await fetch('/api/v1/organizer/password-reset/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value })
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok) {
                form.style.display = 'none';
                document.getElementById('successText').innerText = data.message;
                document.getElementById('successView').style.display = 'block';
                return;
            }
            alertError.innerText = data.message || 'No pudimos procesar el pedido. Probá de nuevo.';
        } catch (err) {
            alertError.innerText = 'Error de conexión con el servidor.';
        }
        alertError.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Mandarme el link';
    });
</script>
</body>
</html>
