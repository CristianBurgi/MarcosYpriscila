<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear mi evento — EventFoto</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background: #f8fafc; color: #0f172a; }
        main { max-width: 440px; margin: 48px auto; padding: 0 20px; }
        h1 { font-size: 1.6rem; margin: 0 0 6px; }
        p.lead { color: #475569; margin: 0 0 24px; }
        label { display: block; font-weight: 600; margin: 16px 0 6px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: 2px solid #6366f1; border-color: #6366f1; }
        small { color: #64748b; }
        button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:disabled { background: #94a3b8; cursor: wait; }
        .error { display: none; margin-top: 20px; padding: 12px; border-radius: 8px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .error a { color: #991b1b; font-weight: 600; }
        .login-link { margin-top: 24px; text-align: center; color: #475569; }
    </style>
</head>
<body>
<main>
    <h1>Creá tu evento</h1>
    <p class="lead">Completá tus datos y pasá al pago con Mercado Pago. Con la cuenta que armes acá vas a manejar el álbum de tu evento.</p>

    <form id="buyForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <small>Al menos 8 caracteres. Evitá claves fáciles de adivinar.</small>

        <label for="passwordConfirmation">Repetí la contraseña</label>
        <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required>

        <label for="eventName">Nombre del evento</label>
        <input id="eventName" name="eventName" type="text" maxlength="100" required>

        <button type="submit" id="submitButton">Ir a pagar</button>
        <div class="error" id="errorBox" role="alert"></div>
    </form>

    <p class="login-link">¿Ya tenés una cuenta? <a href="/admin/login">Iniciá sesión</a></p>
</main>

<script>
    const form = document.getElementById('buyForm');
    const button = document.getElementById('submitButton');
    const errorBox = document.getElementById('errorBox');

    function showError(message, withLoginLink) {
        errorBox.textContent = message;
        if (withLoginLink) {
            errorBox.append(' ');
            const link = document.createElement('a');
            link.href = '/admin/login';
            link.textContent = 'Ir a iniciar sesión';
            errorBox.append(link);
        }
        errorBox.style.display = 'block';
    }

    function validate(data) {
        const problems = [];
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email.trim())) problems.push('Ingresá un email válido');
        if (data.password.length < 8) problems.push('La contraseña tiene que tener al menos 8 caracteres');
        if (data.password !== data.passwordConfirmation) problems.push('Las contraseñas no coinciden');
        if (!data.eventName.trim()) problems.push('Ingresá el nombre del evento');
        return problems;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        const data = {
            email: form.email.value,
            password: form.password.value,
            passwordConfirmation: form.passwordConfirmation.value,
            eventName: form.eventName.value
        };
        const problems = validate(data);
        if (problems.length) { showError(problems.join('. ')); return; }

        button.disabled = true;           // un solo clic: dos clics serían dos compras pendientes
        button.textContent = 'Un momento…';
        try {
            const response = await fetch('/api/v1/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok && body.redirectUrl) {
                window.location.href = body.redirectUrl;
                return;
            }
            showError(body.message || 'No pudimos procesar tu pedido. Probá de nuevo en unos minutos.', response.status === 409);
        } catch (err) {
            showError('No pudimos conectarnos. Revisá tu conexión y probá de nuevo.');
        }
        button.disabled = false;
        button.textContent = 'Ir a pagar';
    });
</script>
</body>
</html>
