<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recibimos tu pedido de arrepentimiento</title>
</head>
<body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
    <tr><td>
        <h1 style="font-size:22px;margin:0 0 12px;">Recibimos tu pedido de arrepentimiento</h1>
        <p style="font-size:16px;line-height:1.5;margin:0 0 16px;">
            Tu pedido para revocar la compra de EventFoto quedó registrado.
        </p>
        <table role="presentation" style="font-size:15px;line-height:1.5;border-collapse:collapse;">
            <tr><td style="padding:4px 12px 4px 0;color:#64748b;">Número de pedido</td><td style="padding:4px 0;font-weight:bold;" th:text="${number}">A1B2C3D4</td></tr>
            <tr><td style="padding:4px 12px 4px 0;color:#64748b;">Recibido</td><td style="padding:4px 0;" th:text="${receivedAt} + ' (hora de Argentina)'">fecha</td></tr>
        </table>
        <p style="font-size:16px;line-height:1.5;margin:16px 0 0;">
            Te vamos a responder por este mismo medio, a esta dirección de email.
        </p>
        <p style="font-size:14px;line-height:1.5;color:#64748b;margin:20px 0 0;">
            Si no hiciste este pedido, respondé este mail y avisanos.
        </p>
    </td></tr>
</table>
</body>
</html>
