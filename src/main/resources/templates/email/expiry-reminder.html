<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu álbum se borra pronto</title>
</head>
<body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
    <tr><td>
        <h1 style="font-size:22px;margin:0 0 12px;">Tu álbum se borra pronto</h1>
        <p style="font-size:16px;line-height:1.5;margin:0 0 12px;">
            Las fotos y los mensajes de <strong th:text="${eventName}">el evento</strong> se borran el
            <strong th:text="${deletionDay}">sábado 14 de diciembre</strong>. Después no se pueden recuperar.
        </p>
        <p style="font-size:16px;line-height:1.5;margin:0 0 20px;">
            Antes de esa fecha, entrá a tu panel y descargá el <strong>álbum completo (ZIP)</strong> y el
            <strong>libro de visitas (PDF)</strong>.
        </p>
        <a th:href="${loginUrl}" href="#"
           style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;">Iniciar sesión</a>
    </td></tr>
</table>
</body>
</html>
