<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla del Salón | Boda de Marcos y Priscila</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080706;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }

        .salon-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(8, 7, 6, 0.95), transparent);
        }
        .wedding-brand {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #e5cfb3;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }
        .header-tag {
            background: rgba(229, 207, 179, 0.12);
            border: 1px solid rgba(229, 207, 179, 0.35);
            color: #f3e5d3;
            padding: 0.6rem 1.6rem;
            border-radius: 40px;
            font-size: 1.15rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
        }

        .slideshow-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 5rem;
            padding-bottom: 4.5rem;
        }

        .photo-card-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            max-height: 84vh;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            position: absolute;
        }
        .photo-card-frame.active {
            opacity: 1;
            transform: scale(1);
        }

        .slide-img {
            max-width: 88vw;
            max-height: 62vh;
            object-fit: contain;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.85);
            background-color: #120e0c;
        }

        .photo-credit-bar {
            width: 100%;
            background: rgba(22, 18, 15, 0.95);
            border: 1px solid rgba(229, 207, 179, 0.35);
            border-top: none;
            padding: 0.7rem 2rem;
            text-align: center;
            color: #e5cfb3;
            font-size: 1.3rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .photo-comments-container {
            width: 100%;
            background: rgba(30, 24, 19, 0.95);
            border: 1px solid rgba(229, 207, 179, 0.35);
            border-top: 1px solid rgba(229, 207, 179, 0.15);
            border-radius: 0 0 16px 16px;
            padding: 0.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 80px;
            transition: opacity 0.4s ease;
        }

        .comments-badge {
            font-size: 0.85rem;
            color: #e5cfb3;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 0.2rem;
            text-align: right;
            opacity: 0.8;
        }

        .comment-bubble {
            background: rgba(229, 207, 179, 0.1);
            border-left: 3px solid #d4af37;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.15rem;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-author-name {
            color: #e5cfb3;
            font-weight: 700;
            margin-right: 0.4rem;
        }

        .message-banner-overlay {
            position: absolute;
            bottom: 4.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 85%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(28, 22, 18, 0.96), rgba(16, 12, 10, 0.96));
            border: 2px solid #e5cfb3;
            border-radius: 20px;
            padding: 1.8rem 2.8rem;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9);
            z-index: 30;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
            text-align: center;
        }
        .message-banner-overlay.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .banner-author {
            color: #e5cfb3;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .banner-text {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .empty-state {
            text-align: center;
            color: #b8a693;
            font-size: 1.8rem;
            font-family: 'Cinzel', serif;
        }

        /* Zócalo / Ticker de mensajes en la parte inferior */
        .ticker-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(15, 12, 10, 0.94);
            border-top: 1px solid rgba(229, 207, 179, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 100;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.7);
        }

        .ticker-badge {
            background: linear-gradient(135deg, #8c2b3e 0%, #521321 100%);
            border-right: 1px solid rgba(229, 207, 179, 0.4);
            color: #fdf6f7;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 0 1.2rem;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            flex-shrink: 0;
            z-index: 105;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.5);
        }

        .ticker-viewport {
            flex-grow: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        .ticker-track {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
            animation: tickerScroll 35s linear infinite;
        }

        .ticker-track:hover {
            animation-play-state: paused;
        }

        @keyframes tickerScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            font-size: 1.05rem;
            color: #ffffff;
            padding: 0 0.5rem;
        }

        .ticker-author {
            color: #e5cfb3;
            font-weight: 700;
            margin-right: 0.35rem;
        }

        .ticker-separator {
            margin: 0 1.5rem;
            color: #d4af37;
            opacity: 0.75;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="salon-header">
        <div class="wedding-brand">💍 MARCOS & PRISCILA</div>
        <div class="header-tag">📸 ¡Subí tus fotos a la boda desde tu celular!</div>
    </header>

    <div class="slideshow-stage" id="stage">
        <div class="empty-state" id="empty-message">
            Esperando las primeras fotos aprobadas del evento...
        </div>
    </div>

    <div class="message-banner-overlay" id="msg-banner">
        <div class="banner-author" id="banner-author">💬 Mensaje de Invitado</div>
        <div class="banner-text" id="banner-text">¡Les deseamos toda la felicidad!</div>
    </div>

    <!-- Zócalo Ticker de Mensajes (Loop continuo al pie) -->
    <div class="ticker-bar">
        <div class="ticker-badge">💌 Libro de Visitas</div>
        <div class="ticker-viewport">
            <div class="ticker-track" id="ticker-track"></div>
        </div>
    </div>

    <script>
        const SLUG = 'marcos-y-priscila';
        let photos = [];
        let currentIndex = 0;
        let slideshowInterval = null;

        let tickerQueue = [];
        const MAX_TICKER_MESSAGES = 50;
        const DEFAULT_TICKER_MESSAGE = {
            authorName: '',
            text: '✨ ¡Dejá tu mensaje y felicitaciones a los novios escaneando el QR en las mesas! 📸'
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchApprovedPhotos();
            fetchTickerMessages();
            setupSSE();
        });

        // 1. Cargar fotos iniciales con sus comentarios
        async function fetchApprovedPhotos() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/photos?page=0&size=100`);
                const data = await res.json();
                
                if (data.content && data.content.length > 0) {
                    photos = data.content;
                    startSlideshow();
                }
            } catch (err) {
                console.error('Error al cargar fotos para la pantalla del salón:', err);
            }
        }

        // 2. Iniciar el carrusel
        function startSlideshow() {
            if (photos.length === 0) return;

            const emptyMsg = document.getElementById('empty-message');
            if (emptyMsg) emptyMsg.style.display = 'none';

            showNextPhoto();

            if (slideshowInterval) clearInterval(slideshowInterval);
            slideshowInterval = setInterval(showNextPhoto, 7000);
        }

        let commentRotationInterval = null;

        // 3. Mostrar foto con comentarios rotativos (máx 2 a la vez)
        function showNextPhoto() {
            if (photos.length === 0) return;

            if (commentRotationInterval) {
                clearInterval(commentRotationInterval);
                commentRotationInterval = null;
            }

            const stage = document.getElementById('stage');
            const photo = photos[currentIndex];
            let imageUrl = photo.url || photo.storageKey;

            if (imageUrl && !imageUrl.startsWith('http') && !imageUrl.startsWith('/')) {
                imageUrl = '/' + imageUrl;
            }

            const uploader = photo.uploaderName || 'Invitado';

            // Capturar todas las tarjetas existentes antes de agregar la nueva
            const existingFrames = Array.from(stage.querySelectorAll('.photo-card-frame'));

            const newFrame = document.createElement('div');
            newFrame.className = 'photo-card-frame';

            newFrame.innerHTML = `
                <img class="slide-img" src="${imageUrl}" alt="Foto de la boda" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1519741497674-611481863552?w=1600&auto=format&fit=crop';">
                <div class="photo-credit-bar">📸 Subida por ${escapeHtml(uploader)}</div>
            `;

            renderPhotoComments(photo, newFrame);

            stage.appendChild(newFrame);

            // Transición suave: activar la nueva y remover progresivamente las anteriores
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    newFrame.classList.add('active');
                    existingFrames.forEach(f => {
                        f.classList.remove('active');
                        setTimeout(() => f.remove(), 1000);
                    });
                });
            });

            currentIndex = (currentIndex + 1) % photos.length;
        }

        // Renderiza comentarios rotativos en lotes de a 2 si la foto tiene muchas dedicatorias
        function renderPhotoComments(photo, frameElement) {
            if (!photo.comments || photo.comments.length === 0) return;

            const comments = photo.comments;
            let commentIndex = 0;
            const pageSize = 2;

            const container = document.createElement('div');
            container.className = 'photo-comments-container';
            frameElement.appendChild(container);

            function updateBatch() {
                const batch = comments.slice(commentIndex, commentIndex + pageSize);
                const total = comments.length;
                const badge = total > pageSize 
                    ? `<div class="comments-badge">💬 Dedicatorias (${commentIndex + 1}-${Math.min(commentIndex + batch.length, total)} de ${total})</div>`
                    : '';

                const bubblesHtml = batch.map(c => `
                    <div class="comment-bubble">
                        <span class="comment-author-name">💬 ${escapeHtml(c.authorName)}:</span>"${escapeHtml(c.text)}"
                    </div>
                `).join('');

                container.innerHTML = badge + bubblesHtml;

                if (total > pageSize) {
                    commentIndex = (commentIndex + pageSize) % total;
                }
            }

            updateBatch();

            if (comments.length > pageSize) {
                commentRotationInterval = setInterval(updateBatch, 3500);
            }
        }

        // 4. Extraer payload SSE
        function extractPayload(eventData) {
            try {
                const parsed = JSON.parse(eventData);
                return parsed.payload ? parsed.payload : parsed;
            } catch (e) {
                return {};
            }
        }

        // 5. Nueva foto aprobada en vivo
        function handleNewApprovedPhoto(photoPayload) {
            if (!photoPayload || !photoPayload.id) return;

            // Evitar fotos duplicadas si la ID ya existe
            const exists = photos.some(p => p.id === photoPayload.id);
            if (exists) return;

            photos.unshift(photoPayload);

            if (photos.length === 1) {
                startSlideshow();
                return;
            }

            currentIndex = 0;
            showNextPhoto();

            if (slideshowInterval) clearInterval(slideshowInterval);
            slideshowInterval = setInterval(showNextPhoto, 7000);
        }

        // 6. Nuevo mensaje en vivo
        function handleNewMessage(msgPayload) {
            const author = msgPayload.authorName || 'Invitado';
            const text = msgPayload.text || '';

            if (!text) return;

            const banner = document.getElementById('msg-banner');
            document.getElementById('banner-author').innerText = `💬 Mensaje de ${escapeHtml(author)}`;
            document.getElementById('banner-text').innerText = `"${escapeHtml(text)}"`;

            banner.classList.add('visible');

            setTimeout(() => {
                banner.classList.remove('visible');
            }, 9000);
        }

        // 7. Conexión SSE con autoreconexión
        function setupSSE() {
            if (!!window.EventSource) {
                const eventSource = new EventSource(`/api/v1/events/${SLUG}/stream`);

                eventSource.addEventListener('PHOTO_APPROVED', (e) => {
                    const payload = extractPayload(e.data);
                    handleNewApprovedPhoto(payload);
                });

                eventSource.addEventListener('MESSAGE_CREATED', (e) => {
                    const payload = extractPayload(e.data);
                    handleNewMessage(payload);
                    addMessageToTicker(payload);
                });

                eventSource.addEventListener('MESSAGE_DELETED', (e) => {
                    const payload = extractPayload(e.data);
                    const msgId = payload.id || (payload.data ? payload.data.id : null);
                    if (msgId) {
                        removeMessageFromTicker(msgId);
                    }
                });

                eventSource.onerror = (err) => {
                    console.warn('Reconectando canal SSE del salón...', err);
                };
            }
        }

        // 8. Cargar mensajes iniciales para el ticker del zócalo
        async function fetchTickerMessages() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/messages?page=0&size=20`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.content && data.content.length > 0) {
                        tickerQueue = data.content.map(m => ({
                            id: m.id,
                            authorName: m.authorName && m.authorName.trim() ? m.authorName.trim() : 'Invitado',
                            text: m.text ? m.text.trim() : ''
                        })).filter(m => m.text);
                    }
                }
            } catch (err) {
                console.warn('Error al cargar mensajes del zócalo:', err);
            }

            if (tickerQueue.length === 0) {
                tickerQueue = [DEFAULT_TICKER_MESSAGE];
            }

            renderTickerTrack();
        }

        // 9. Renderizar zócalo con duplicación (Set 1 + Set 2) para loop suave e infinito sin saltos
        function renderTickerTrack() {
            const track = document.getElementById('ticker-track');
            if (!track) return;

            const itemsHtml = tickerQueue.map(m => {
                const authorHtml = m.authorName ? `<span class="ticker-author">${escapeHtml(m.authorName)}:</span>` : '';
                return `<div class="ticker-item">${authorHtml}"${escapeHtml(m.text)}"</div><span class="ticker-separator">✨</span>`;
            }).join('');

            track.innerHTML = itemsHtml + itemsHtml;

            // Calcular duración dinámica basada en la longitud total del texto (~70px/s)
            const textLength = tickerQueue.reduce((acc, m) => acc + (m.authorName ? m.authorName.length : 0) + m.text.length, 0);
            const duration = Math.max(18, Math.round(textLength * 0.32));
            track.style.animationDuration = `${duration}s`;
        }

        // 10. Agregar nuevo mensaje en tiempo real al ticker
        function addMessageToTicker(msgPayload) {
            if (!msgPayload || !msgPayload.text) return;

            if (tickerQueue.length === 1 && tickerQueue[0] === DEFAULT_TICKER_MESSAGE) {
                tickerQueue = [];
            }

            const author = msgPayload.authorName && msgPayload.authorName.trim() ? msgPayload.authorName.trim() : 'Invitado';
            const newMsg = { id: msgPayload.id, authorName: author, text: msgPayload.text.trim() };

            const lastMsg = tickerQueue[tickerQueue.length - 1];
            if (lastMsg && lastMsg.text === newMsg.text && lastMsg.authorName === newMsg.authorName) {
                return;
            }

            tickerQueue.push(newMsg);

            // Mantener máximo 50 mensajes en memoria descartando los más antiguos
            if (tickerQueue.length > MAX_TICKER_MESSAGES) {
                tickerQueue.shift();
            }

            renderTickerTrack();
        }

        // 11. Remover mensaje eliminado del ticker en tiempo real
        function removeMessageFromTicker(messageId) {
            if (!messageId) return;
            tickerQueue = tickerQueue.filter(m => m.id !== messageId);
            if (tickerQueue.length === 0) {
                tickerQueue = [DEFAULT_TICKER_MESSAGE];
            }
            renderTickerTrack();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
