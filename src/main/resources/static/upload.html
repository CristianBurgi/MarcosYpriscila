<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Fotografía | Boda de Marcos y Priscila</title>
    <!-- Google Fonts, FontAwesome & Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css?v=3">
    <style>
        html, body {
            background: linear-gradient(to bottom, rgba(52, 9, 18, 0.82), rgba(20, 3, 7, 0.94)),
                        url('/images/wedding_couple.png?v=3') no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            color: #fdf6f7 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .header-section {
            text-align: center;
            padding: 2.5rem 1.25rem 1rem;
        }

        .wedding-title-main {
            font-family: 'Playfair Display', 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 600;
            color: #fdf6f7;
            margin-bottom: 0.25rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: #e2c2c6;
            max-width: 500px;
            margin: 0.4rem auto 1.5rem;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #e6c594;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            padding: 6px 14px;
            background: rgba(59, 10, 20, 0.6);
            border: 1px solid rgba(247, 225, 228, 0.2);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            background: rgba(140, 43, 62, 0.6);
            text-decoration: none;
        }

        .card-glass {
            background: rgba(59, 10, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(247, 225, 228, 0.22);
            box-sizing: border-box;
        }

        .source-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .btn-source {
            background: rgba(20, 3, 7, 0.6);
            border: 1px solid rgba(247, 225, 228, 0.3);
            color: #fdf6f7;
            padding: 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-source:hover {
            background: rgba(140, 43, 62, 0.5);
            border-color: #f7e1e4;
            transform: translateY(-2px);
        }

        .btn-source.selected {
            background: linear-gradient(135deg, #6b1c2d 0%, #521321 100%);
            border-color: #e6c594;
            box-shadow: 0 4px 16px rgba(140, 43, 62, 0.5);
        }

        .preview-container {
            width: 100%;
            max-height: 380px;
            background: rgba(15, 3, 6, 0.85);
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            overflow: hidden;
            border: 1px solid rgba(247, 225, 228, 0.2);
            padding: 8px;
            box-sizing: border-box;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(20, 3, 7, 0.8);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            margin-top: 1rem;
            border: 1px solid rgba(247, 225, 228, 0.2);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8c2b3e, #e6c594);
            transition: width 0.3s ease;
        }

        .btn-burgundy-full {
            width: 100%;
            background: linear-gradient(135deg, #6b1c2d 0%, #521321 100%);
            border: 1px solid rgba(247, 225, 228, 0.25);
            color: #fdf6f7;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 12px;
            padding: 0.9rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-burgundy-full:hover {
            background: linear-gradient(135deg, #8c2b3e 0%, #6b1c2d 100%);
            box-shadow: 0 4px 18px rgba(140, 43, 62, 0.4);
        }

        .footer-wedding {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            color: #e2c2c6;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header class="container header-section">
        <a href="/menu.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
        <h1 class="wedding-title-main">
            <i class="fa-solid fa-cloud-arrow-up" style="color: #e6c594;"></i> Subir Fotografía
        </h1>
        <p class="welcome-subtitle">Compartí tus momentos de la boda en tiempo real</p>
        <div id="quota-badge" style="display: none; margin: 0 auto 0.5rem; width: fit-content; color: #e6c594; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 16px; background: rgba(59, 10, 20, 0.6); border: 1px solid rgba(247, 225, 228, 0.2); border-radius: 20px;"></div>
    </header>

    <main class="container" style="max-width: 650px; margin: 0 auto; padding: 0 1.25rem;">
        <article class="card-glass">
            <div id="event-closed-banner" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 14px 18px; border-radius: 14px; text-align: center; margin-bottom: 1.5rem; font-weight: 600; font-size: 1.05rem;">
                <i class="fa-solid fa-lock" style="margin-right: 6px;"></i> La recepción de fotografías se encuentra temporalmente cerrada por los novios.
            </div>
            <div id="quota-exceeded-banner" style="display: none; background: rgba(230, 197, 148, 0.18); border: 1px solid rgba(230, 197, 148, 0.4); color: #f3dfa8; padding: 14px 18px; border-radius: 14px; text-align: center; margin-bottom: 1.5rem; font-weight: 600; font-size: 1.05rem;">
                <i class="fa-solid fa-champagne-glasses" style="margin-right: 6px;"></i> Ya usaste tus 24 fotos para este evento — ¡gracias por compartir tantos momentos! 🎉
            </div>
            <form id="upload-form">
                <label for="uploaderName" style="color: #fdf6f7; font-weight: 500;">Tu Nombre <span style="color: #fca5a5;">*</span>:</label>
                <input type="text" id="uploaderName" name="uploaderName" placeholder="Ej: Sofía y Nahuel" required maxlength="150" style="background: rgba(20, 3, 7, 0.7); color: #fff; border: 1px solid rgba(247, 225, 228, 0.3); border-radius: 10px; margin-bottom: 1rem;">

                <label for="caption" style="color: #fdf6f7; font-weight: 500;">Dedicatoria para los novios (opcional):</label>
                <input type="text" id="caption" name="caption" placeholder="¡Momento inolvidable en la fiesta!" maxlength="500" style="background: rgba(20, 3, 7, 0.7); color: #fff; border: 1px solid rgba(247, 225, 228, 0.3); border-radius: 10px; margin-bottom: 1rem;">

                <label style="color: #fdf6f7; font-weight: 500;">Elegir Imagen <span style="color: #fca5a5;">*</span>:</label>
                <div class="source-buttons">
                    <button type="button" class="btn-source" id="btn-camera">
                        <i class="fa-solid fa-camera" style="font-size: 1.4rem; color: #e6c594;"></i> Tomar Foto
                    </button>
                    <button type="button" class="btn-source" id="btn-gallery">
                        <i class="fa-solid fa-images" style="font-size: 1.4rem; color: #e6c594;"></i> Abrir Galería
                    </button>
                </div>

                <input type="file" id="cameraFile" accept="image/*" capture="environment" style="display: none;">
                <input type="file" id="galleryFile" accept="image/*" style="display: none;">

                <div class="preview-container" id="preview-box">
                    <img id="image-preview" src="#" alt="Vista previa de la foto">
                </div>

                <div class="progress-bar-container" id="progress-box">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>

                <button type="submit" id="btn-submit" class="btn-burgundy-full" style="margin-top: 1.5rem;">
                    Subir y Compartir Foto
                </button>
            </form>

            <div id="status-message"></div>
        </article>
    </main>

    <footer class="footer-wedding">
        <small>✦ Boda de Marcos y Priscila &bull; Celebrando el amor ✦</small>
    </footer>

    <script>
        const SLUG = 'marcos-y-priscila';
        let selectedFile = null;

        const GUEST_TOKEN_KEY = 'eventfoto_guest_token';
        function getOrCreateGuestToken() {
            let token = localStorage.getItem(GUEST_TOKEN_KEY);
            if (!token) {
                token = crypto.randomUUID();
                localStorage.setItem(GUEST_TOKEN_KEY, token);
            }
            return token;
        }
        const GUEST_TOKEN = getOrCreateGuestToken();
        const QUOTA_EXCEEDED_MESSAGE = 'Ya usaste tus 24 fotos para este evento — ¡gracias por compartir tantos momentos! 🎉';

        document.addEventListener('DOMContentLoaded', () => {
            checkEventStatus();
            loadGuestQuota();

            const btnCamera = document.getElementById('btn-camera');
            const btnGallery = document.getElementById('btn-gallery');
            const cameraFile = document.getElementById('cameraFile');
            const galleryFile = document.getElementById('galleryFile');
            const previewBox = document.getElementById('preview-box');
            const imagePreview = document.getElementById('image-preview');

            btnCamera.addEventListener('click', () => cameraFile.click());
            btnGallery.addEventListener('click', () => galleryFile.click());

            const handleFileSelected = (file, sourceBtn) => {
                if (!file) return;
                selectedFile = file;

                btnCamera.classList.remove('selected');
                btnGallery.classList.remove('selected');
                if (sourceBtn) sourceBtn.classList.add('selected');

                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    previewBox.style.display = 'block';
                };
                reader.readAsDataURL(file);
            };

            cameraFile.addEventListener('change', (e) => handleFileSelected(e.target.files[0], btnCamera));
            galleryFile.addEventListener('change', (e) => handleFileSelected(e.target.files[0], btnGallery));

            document.getElementById('upload-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const statusDiv = document.getElementById('status-message');
                const btn = document.getElementById('btn-submit');
                const progressBox = document.getElementById('progress-box');
                const progressFill = document.getElementById('progress-fill');

                const uploaderName = document.getElementById('uploaderName').value.trim();
                const caption = document.getElementById('caption').value.trim();

                if (!uploaderName) {
                    statusDiv.innerHTML = '<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">Por favor ingresá tu nombre. Es obligatorio.</div>';
                    return;
                }

                if (!selectedFile) {
                    statusDiv.innerHTML = '<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">Por favor seleccioná o tomá una foto usando los botones superiores.</div>';
                    return;
                }

                let contentType = selectedFile.type || 'image/jpeg';
                if (contentType.toLowerCase() === 'image/jpg') {
                    contentType = 'image/jpeg';
                }

                try {
                    btn.disabled = true;
                    btn.innerText = 'Optimizando foto...';
                    progressBox.style.display = 'block';
                    progressFill.style.width = '15%';

                    const fileToUpload = await compressImageIfNeeded(selectedFile);

                    let contentType = fileToUpload.type || 'image/jpeg';
                    if (contentType.toLowerCase() === 'image/jpg') {
                        contentType = 'image/jpeg';
                    }

                    btn.innerText = 'Iniciando subida...';
                    progressFill.style.width = '30%';

                    let isSuccess = false;
                    let quotaExceeded = false;

                    try {
                        const presignedRes = await fetch(`/api/v1/events/${SLUG}/photos/upload-url`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contentType: contentType, filename: fileToUpload.name || 'photo.jpg', guestToken: GUEST_TOKEN })
                        });

                        if (presignedRes.status === 403) {
                            quotaExceeded = true;
                        } else if (presignedRes.ok) {
                            const { uploadUrl, key } = await presignedRes.json();
                            progressFill.style.width = '60%';
                            btn.innerText = 'Subiendo fotografía...';

                            const uploadRes = await fetch(uploadUrl, {
                                method: 'PUT',
                                headers: { 'Content-Type': contentType },
                                body: fileToUpload
                            });

                            if (uploadRes.ok) {
                                progressFill.style.width = '85%';
                                btn.innerText = 'Registrando en la boda...';

                                const confirmRes = await fetch(`/api/v1/events/${SLUG}/photos/confirm`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ key, uploaderName, caption, guestToken: GUEST_TOKEN })
                                });

                                if (confirmRes.status === 403) {
                                    quotaExceeded = true;
                                } else if (confirmRes.ok) {
                                    isSuccess = true;
                                }
                            }
                        }
                    } catch (presignedErr) {
                        console.warn('Subida directa R2 Presigned bloqueada por el navegador o red. Ejecutando fallback garantizado vía servidor:', presignedErr);
                    }

                    if (quotaExceeded) {
                        throw new Error(QUOTA_EXCEEDED_MESSAGE);
                    }

                    if (!isSuccess) {
                        btn.innerText = 'Enviando fotografía...';
                        progressFill.style.width = '70%';

                        const safeFileName = (fileToUpload.name && fileToUpload.name.trim()) ? fileToUpload.name : 'galeria_photo.jpg';
                        const formData = new FormData();
                        formData.append('file', fileToUpload, safeFileName);
                        formData.append('uploaderName', uploaderName);
                        if (caption) formData.append('caption', caption);
                        formData.append('guestToken', GUEST_TOKEN);

                        const directRes = await fetch(`/api/v1/events/${SLUG}/photos/upload-direct`, {
                            method: 'POST',
                            body: formData
                        });

                        if (directRes.status === 403) {
                            throw new Error(QUOTA_EXCEEDED_MESSAGE);
                        }

                        if (!directRes.ok) {
                            const errData = await directRes.json().catch(() => ({}));
                            throw new Error(errData.message || 'No se pudo enviar la fotografía desde la galería. Intentalo de nuevo.');
                        }
                    }

                    progressFill.style.width = '100%';
                    statusDiv.innerHTML = '<div class="alert-box alert-success" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac; padding: 10px; border-radius: 8px; margin-top: 10px;">¡Foto subida con éxito! Quedó registrada y aparecerá en el álbum una vez aprobada. 📸</div>';

                    loadGuestQuota();

                    document.getElementById('caption').value = '';
                    selectedFile = null;
                    cameraFile.value = '';
                    galleryFile.value = '';
                    btnCamera.classList.remove('selected');
                    btnGallery.classList.remove('selected');
                    previewBox.style.display = 'none';

                    setTimeout(() => {
                        statusDiv.innerHTML = '';
                        progressBox.style.display = 'none';
                        progressFill.style.width = '0%';
                    }, 5000);

                } catch (err) {
                    console.error(err);
                    statusDiv.innerHTML = `<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">${escapeHtml(err.message)}</div>`;
                    progressBox.style.display = 'none';
                    progressFill.style.width = '0%';

                    if (err.message === QUOTA_EXCEEDED_MESSAGE) {
                        // El backend rechazó por cupo agotado en una condición de carrera que
                        // el frontend no había detectado a tiempo (ej. otra pestaña gastó el
                        // último cupo justo antes). Se refresca el badge/estado del form.
                        loadGuestQuota();
                    }
                } finally {
                    const btn = document.getElementById('btn-submit');
                    if (btn && !btn.getAttribute('data-closed')) {
                        btn.disabled = false;
                        btn.innerText = 'Subir y Compartir Foto';
                    }
                }
            });
        });

        async function checkEventStatus() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}`);
                if (res.ok) {
                    const eventData = await res.json();
                    if (eventData && eventData.isActive === false) {
                        disableUploadForm('closed');
                    }
                }
            } catch (err) {
                console.warn('No se pudo verificar el estado del evento:', err);
            }
        }

        async function loadGuestQuota() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/guest-quota?token=${encodeURIComponent(GUEST_TOKEN)}`);
                if (res.ok) {
                    const { remainingPhotos, maxPhotosPerGuest } = await res.json();
                    updateQuotaBadge(remainingPhotos, maxPhotosPerGuest);
                    if (remainingPhotos <= 0) {
                        disableUploadForm('quota');
                    }
                }
            } catch (err) {
                console.warn('No se pudo verificar el cupo de fotos del invitado:', err);
            }
        }

        function updateQuotaBadge(remaining, max) {
            const badge = document.getElementById('quota-badge');
            if (!badge) return;
            badge.style.display = 'inline-block';
            badge.innerHTML = `<i class="fa-solid fa-camera-retro" style="margin-right: 6px;"></i> Te quedan <strong>${remaining}</strong> de ${max} fotos`;
        }

        function disableUploadForm(reason = 'closed') {
            const closedBanner = document.getElementById('event-closed-banner');
            const quotaBanner = document.getElementById('quota-exceeded-banner');

            if (reason === 'quota') {
                if (quotaBanner) quotaBanner.style.display = 'block';
            } else {
                if (closedBanner) closedBanner.style.display = 'block';
            }

            const nameInput = document.getElementById('uploaderName');
            const captionInput = document.getElementById('caption');
            if (nameInput) nameInput.disabled = true;
            if (captionInput) captionInput.disabled = true;

            const btnCamera = document.getElementById('btn-camera');
            const btnGallery = document.getElementById('btn-gallery');
            const btnSubmit = document.getElementById('btn-submit');

            if (btnCamera) { btnCamera.disabled = true; btnCamera.style.opacity = '0.5'; btnCamera.style.cursor = 'not-allowed'; }
            if (btnGallery) { btnGallery.disabled = true; btnGallery.style.opacity = '0.5'; btnGallery.style.cursor = 'not-allowed'; }
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.setAttribute('data-closed', 'true');
                btnSubmit.innerText = reason === 'quota' ? '🎉 Ya usaste tus 24 fotos' : '🔒 Recepción de Fotos Cerrada';
                btnSubmit.style.opacity = '0.5';
                btnSubmit.style.cursor = 'not-allowed';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function compressImageIfNeeded(file) {
            if (!file || file.size <= 1.5 * 1024 * 1024) {
                return file;
            }

            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);

                    const maxDim = 2048;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (blob) {
                            const compressedFile = new File([blob], file.name || 'photo.jpg', {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        } else {
                            resolve(file);
                        }
                    }, 'image/jpeg', 0.85);
                };
                img.onerror = () => resolve(file);
                img.src = url;
            });
        }
    </script>
</body>
</html>
