<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de Fotos | Boda de Marcos y Priscila</title>
    <!-- Google Fonts & Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css?v=3">
    <style>
        html, body {
            background: linear-gradient(to bottom, rgba(52, 9, 18, 0.82), rgba(20, 3, 7, 0.94)),
                        url('/images/wedding_couple.png?v=3') no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            color: #fdf6f7 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .gallery-header {
            text-align: center;
            padding: 2.5rem 1.25rem 1rem;
        }

        .wedding-title-main {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #fdf6f7;
            margin-bottom: 0.25rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .wedding-title-icon {
            font-size: 2.4rem;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: #e2c2c6;
            max-width: 500px;
            margin: 0.4rem auto 1.5rem;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #e6c594;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            padding: 6px 14px;
            background: rgba(59, 10, 20, 0.6);
            border: 1px solid rgba(247, 225, 228, 0.2);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            background: rgba(140, 43, 62, 0.6);
            text-decoration: none;
        }

        /* Grilla de la Galería */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .gallery-card {
            background: rgba(59, 10, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(247, 225, 228, 0.22);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: #f7e1e4;
            box-shadow: 0 14px 36px rgba(107, 28, 45, 0.5);
        }

        /* Contenedor de la Imagen: EVITA EL RECORTE DE FOTOS */
        .gallery-img-wrapper {
            width: 100%;
            height: 320px;
            background: rgba(18, 3, 6, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 6px;
            box-sizing: border-box;
        }

        .gallery-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain !important; /* SIN RECORTE DE FOTOS */
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover .gallery-img-wrapper img {
            transform: scale(1.02);
        }

        .gallery-card-footer {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(35, 6, 12, 0.85);
            border-top: 1px solid rgba(247, 225, 228, 0.15);
        }

        .badge-uploader {
            background: rgba(140, 43, 62, 0.5);
            color: #fdf6f7;
            border: 1px solid rgba(247, 225, 228, 0.25);
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .comments-count {
            color: #e2c2c6;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
        }

        /* Modal Styles Glassmorphic */
        dialog.modal-photo {
            max-width: 780px;
            width: 92vw;
            border-radius: 20px;
            border: 1px solid rgba(247, 225, 228, 0.3);
            background: rgba(38, 6, 13, 0.96);
            color: #fdf6f7;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        dialog.modal-photo::backdrop {
            background: rgba(15, 3, 6, 0.85);
            backdrop-filter: blur(8px);
        }

        .modal-body {
            max-height: 88vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(247, 225, 228, 0.15);
        }

        .modal-header-custom h4 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #fdf6f7;
        }

        .btn-close-modal {
            background: rgba(247, 225, 228, 0.15);
            color: #fdf6f7;
            border: 1px solid rgba(247, 225, 228, 0.3);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-close-modal:hover {
            background: rgba(239, 68, 68, 0.4);
            color: #ffffff;
        }

        .modal-img-container {
            width: 100%;
            max-height: 520px;
            background: rgba(15, 3, 6, 0.9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-sizing: border-box;
        }

        .modal-img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
        }

        .comment-item {
            background: rgba(59, 10, 20, 0.6);
            border-left: 3px solid #8c2b3e;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            border-top: 1px solid rgba(247, 225, 228, 0.1);
            border-right: 1px solid rgba(247, 225, 228, 0.1);
            border-bottom: 1px solid rgba(247, 225, 228, 0.1);
        }

        .btn-burgundy-full {
            background: linear-gradient(135deg, #6b1c2d 0%, #521321 100%);
            border: 1px solid rgba(247, 225, 228, 0.25);
            color: #fdf6f7;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-burgundy-full:hover {
            background: linear-gradient(135deg, #8c2b3e 0%, #6b1c2d 100%);
            box-shadow: 0 4px 16px rgba(140, 43, 62, 0.4);
        }

        .footer-wedding {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            color: #e2c2c6;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header class="container gallery-header">
        <a href="/menu.html" class="back-link">← Volver al Menú</a>
        <h1 class="wedding-title-main">
            <span class="wedding-title-icon">📸</span> Álbum de Fotos
        </h1>
        <p class="welcome-subtitle">Reviví los mejores momentos compartidos por nuestros invitados</p>
    </header>

    <main class="container" style="max-width: 1100px; margin: 0 auto; padding: 0 1.25rem;">
        <div class="gallery-grid" id="gallery-container">
            <p style="grid-column: 1 / -1; text-align: center; color: #e2c2c6;">Cargando fotografías del evento...</p>
        </div>

        <div style="text-align: center; margin-top: 2.5rem; margin-bottom: 2rem;">
            <button id="btn-load-more" class="btn-burgundy-full" style="display: none; width: auto; padding: 0.8rem 2.5rem;">
                Cargar más fotos
            </button>
        </div>
    </main>

    <!-- Modal para ver Foto + Comentarios -->
    <dialog id="photo-modal" class="modal-photo">
        <article class="modal-body" style="margin: 0;">
            <header class="modal-header-custom">
                <h4 id="modal-uploader">Foto de la boda</h4>
                <button type="button" aria-label="Cerrar" id="btn-close-modal" class="btn-close-modal">✕</button>
            </header>

            <div class="modal-img-container">
                <img id="modal-img" class="modal-img" src="#" alt="Fotografía ampliada">
            </div>

            <section style="margin-top: 1.5rem;">
                <h5 style="font-size: 1.1rem; color: #fdf6f7; margin-bottom: 1rem;">💬 Comentarios (<span id="modal-comments-count">0</span>)</h5>
                
                <div id="modal-comments-list">
                    <p style="color: #e2c2c6;">Cargando comentarios...</p>
                </div>

                <form id="comment-form" style="margin-top: 1.5rem;">
                    <label for="commentAuthor" style="color: #fdf6f7; font-weight: 500;">Tu Nombre <span style="color: #fca5a5;">*</span>:</label>
                    <input type="text" id="commentAuthor" name="authorName" placeholder="Ej: Primo Lucas" required maxlength="150" style="background: rgba(20, 3, 7, 0.7); color: #fff; border: 1px solid rgba(247, 225, 228, 0.3); border-radius: 10px;">

                    <label for="commentText" style="color: #fdf6f7; font-weight: 500; margin-top: 0.8rem;">Comentario <span style="color: #fca5a5;">*</span>:</label>
                    <input type="text" id="commentText" name="text" placeholder="¡Qué linda foto!" required maxlength="500" style="background: rgba(20, 3, 7, 0.7); color: #fff; border: 1px solid rgba(247, 225, 228, 0.3); border-radius: 10px;">

                    <button type="submit" id="btn-comment-submit" class="btn-burgundy-full" style="width: 100%; margin-top: 1.2rem;">Enviar Comentario</button>
                </form>
                <div id="comment-status"></div>
            </section>
        </article>
    </dialog>

    <footer class="footer-wedding">
        <small>✨ Boda de Marcos y Priscila &bull; Celebrando el amor ✨</small>
    </footer>

    <script>
        const SLUG = 'marcos-y-priscila';
        let currentPage = 0;
        let activePhotoId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadGalleryPage(0);

            document.getElementById('btn-load-more').addEventListener('click', () => {
                loadGalleryPage(currentPage + 1);
            });

            document.getElementById('btn-close-modal').addEventListener('click', () => {
                document.getElementById('photo-modal').close();
            });

            setupCommentForm();
        });

        // 1. Cargar página de la galería
        async function loadGalleryPage(page) {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/photos?page=${page}&size=12`);
                const data = await res.json();
                const container = document.getElementById('gallery-container');
                const btnMore = document.getElementById('btn-load-more');

                if (page === 0) container.innerHTML = '';

                if (!data.content || data.content.length === 0) {
                    if (page === 0) {
                        container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #e2c2c6;"><em>Aún no hay fotografías en la galería pública. ¡Sé el primero en subir una!</em></p>';
                    }
                    btnMore.style.display = 'none';
                    return;
                }

                data.content.forEach(photo => {
                    let imageUrl = photo.url || photo.storageKey;
                    if (imageUrl && !imageUrl.startsWith('http') && !imageUrl.startsWith('/')) {
                        imageUrl = '/' + imageUrl;
                    }

                    const card = document.createElement('div');
                    card.className = 'gallery-card';
                    card.dataset.photoId = photo.id;
                    card.innerHTML = `
                        <div class="gallery-img-wrapper">
                            <img src="${escapeHtml(imageUrl)}" alt="Foto de la boda" onerror="handleImageError(this)">
                        </div>
                        <div class="gallery-card-footer">
                            <span class="badge-uploader">📸 ${escapeHtml(photo.uploaderName || 'Invitado')}</span>
                            <span class="comments-count" id="count-${photo.id}">💬 ${photo.commentCount || 0}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => openPhotoModal(photo));
                    container.appendChild(card);
                });

                currentPage = page;
                if (data.last) {
                    btnMore.style.display = 'none';
                } else {
                    btnMore.style.display = 'inline-block';
                }

            } catch (err) {
                console.error('Error al cargar la galería:', err);
            }
        }

        // Manejo elegante si una foto previa en local o dev no está en el servidor
        function handleImageError(imgElem) {
            imgElem.onerror = null;
            // Usar la foto real de los novios de la boda como elegante fallback en vez de imágenes externas no deseadas
            imgElem.src = '/images/wedding_couple.png';
            imgElem.style.opacity = '0.85';
        }

        // 2. Abrir Modal de Foto + Comentarios
        async function openPhotoModal(photo) {
            activePhotoId = photo.id;
            const modal = document.getElementById('photo-modal');
            
            let imageUrl = photo.url || photo.storageKey;
            if (imageUrl && !imageUrl.startsWith('http') && !imageUrl.startsWith('/')) {
                imageUrl = '/' + imageUrl;
            }

            document.getElementById('modal-uploader').innerText = `📸 Subida por ${photo.uploaderName || 'Invitado'}`;
            
            const modalImg = document.getElementById('modal-img');
            modalImg.onerror = function() {
                this.onerror = null;
                this.src = '/images/wedding_couple.png';
            };
            modalImg.src = imageUrl;

            modal.showModal();
            loadComments(photo.id);
        }

        // 3. Cargar comentarios de una foto
        async function loadComments(photoId) {
            const listDiv = document.getElementById('modal-comments-list');
            const countSpan = document.getElementById('modal-comments-count');

            try {
                const res = await fetch(`/api/v1/photos/${photoId}/comments`);
                const comments = await res.json();

                const total = comments ? comments.length : 0;
                countSpan.innerText = total;

                const cardCountSpan = document.getElementById(`count-${photoId}`);
                if (cardCountSpan) {
                    cardCountSpan.innerText = `💬 ${total}`;
                }

                if (!comments || comments.length === 0) {
                    listDiv.innerHTML = '<p style="color: #e2c2c6; font-style: italic;">No hay comentarios en esta foto. ¡Sé el primero en comentar!</p>';
                    return;
                }

                listDiv.innerHTML = comments.map(c => `
                    <div class="comment-item" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;">
                        <div>
                            <strong style="color: #fdf6f7;">${escapeHtml(c.authorName)}</strong>
                            <p style="margin: 0.2rem 0 0; color: #e2c2c6;">${escapeHtml(c.text)}</p>
                        </div>
                        <button type="button" onclick="deleteComment('${c.id}')" style="width: auto; padding: 0.2rem 0.5rem; font-size: 0.8rem; background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); border-radius: 6px; cursor: pointer;" title="Eliminar comentario como admin">🗑️</button>
                    </div>
                `).join('');

            } catch (err) {
                listDiv.innerHTML = '<p style="color: #fca5a5;">Error al cargar comentarios.</p>';
            }
        }

        // 4. Eliminar comentario como admin
        async function deleteComment(commentId) {
            if (!confirm('¿Seguro que querés eliminar este comentario como administrador?')) return;
            try {
                const res = await fetch(`/api/v1/admin/comments/${commentId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Error al eliminar el comentario.');
                if (activePhotoId) loadComments(activePhotoId);
            } catch (err) {
                alert(err.message);
            }
        }

        // 5. Formulario para agregar comentario
        function setupCommentForm() {
            document.getElementById('comment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!activePhotoId) return;

                const statusDiv = document.getElementById('comment-status');
                const btn = document.getElementById('btn-comment-submit');
                const authorName = document.getElementById('commentAuthor').value.trim();
                const text = document.getElementById('commentText').value.trim();

                if (!authorName || !text) return;

                try {
                    btn.disabled = true;
                    btn.innerText = 'Enviando...';

                    const res = await fetch(`/api/v1/photos/${activePhotoId}/comments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ authorName, text })
                    });

                    if (!res.ok) throw new Error('Error al enviar el comentario.');

                    document.getElementById('commentText').value = '';
                    statusDiv.innerHTML = '<div class="alert-box alert-success" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac; padding: 10px; border-radius: 8px; margin-top: 10px;">¡Comentario publicado!</div>';
                    setTimeout(() => { statusDiv.innerHTML = ''; }, 4000);

                    loadComments(activePhotoId);
                } catch (err) {
                    statusDiv.innerHTML = `<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">${escapeHtml(err.message)}</div>`;
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Enviar Comentario';
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
