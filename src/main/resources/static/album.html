<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de Fotos | Boda de Marcos y Priscila</title>
    <!-- Google Fonts, FontAwesome & Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css?v=3">
    <link rel="stylesheet" href="/css/elegant-theme.css?v=1">
    <style>
        html, body {
            background: linear-gradient(to bottom, rgba(36, 10, 13, 0.86), rgba(16, 4, 5, 0.95)),
                        url('/images/wedding_couple.png?v=3') no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            color: var(--cream) !important;
            font-family: 'Cormorant Garamond', serif !important;
        }

        .gallery-header {
            text-align: center;
            padding: 2rem 1.25rem 0.5rem;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Grilla de la Galería */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 1.4rem;
            margin-top: 1rem;
        }

        .gallery-card {
            background: rgba(90, 26, 32, 0.18);
            border: 1px solid rgba(201, 161, 90, 0.35);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
        }

        .gallery-img-wrapper {
            width: 100%;
            height: 300px;
            background: rgba(16, 4, 5, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 6px;
            box-sizing: border-box;
        }

        .gallery-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain !important;
            border-radius: 2px;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover .gallery-img-wrapper img {
            transform: scale(1.02);
        }

        .gallery-card-footer {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(201, 161, 90, 0.25);
            font-size: 0.9rem;
        }

        .badge-uploader {
            color: var(--gold-soft);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .comments-count {
            color: var(--cream-muted);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        /* Modal */
        dialog.modal-photo {
            max-width: 780px;
            width: 92vw;
            border-radius: 4px;
            border: 1px solid rgba(201, 161, 90, 0.4);
            background: linear-gradient(180deg, var(--wine) 0%, var(--wine-deep) 100%);
            color: var(--cream);
            padding: 0;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        dialog.modal-photo::backdrop {
            background: rgba(10, 2, 3, 0.85);
            backdrop-filter: blur(6px);
        }

        .modal-body {
            max-height: 88vh;
            overflow-y: auto;
            padding: 1.6rem;
        }

        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(201, 161, 90, 0.25);
        }

        .modal-header-custom h4 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.3rem;
            color: var(--cream);
        }

        .btn-close-modal {
            background: transparent;
            color: var(--gold-soft);
            border: 1px solid rgba(201, 161, 90, 0.5);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .btn-close-modal:hover {
            border-color: var(--gold);
            color: var(--cream);
        }

        .modal-img-container {
            width: 100%;
            max-height: 480px;
            background: rgba(10, 2, 3, 0.85);
            border: 1px solid rgba(201, 161, 90, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-sizing: border-box;
        }

        .modal-img {
            max-width: 100%;
            max-height: 460px;
            object-fit: contain;
        }

        .comment-item {
            background: rgba(201, 161, 90, 0.05);
            border-left: 2px solid var(--gold);
            padding: 0.7rem 1rem;
            margin-bottom: 0.7rem;
        }

        .comment-item strong {
            font-family: 'Playfair Display', serif;
            color: var(--cream);
            font-size: 1rem;
        }

        .comment-item p {
            margin: 0.25rem 0 0;
            color: var(--cream-muted);
            font-size: 0.95rem;
            line-height: 1.4;
            font-family: 'Cormorant Garamond', serif;
        }

        .comment-form-elegant .field-elegant {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header class="gallery-header">
        <a href="/menu.html" class="back-link-elegant"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
        <div class="ornament"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
        <h1 class="page-title">Álbum del Evento</h1>
        <p class="page-sub">Reviví los mejores momentos compartidos por nuestros invitados</p>
    </header>

    <main style="max-width: 1050px; margin: 0 auto; padding: 0 1.25rem;">
        <div class="gallery-grid" id="gallery-container">
            <p style="grid-column: 1 / -1; text-align: center; color: var(--cream-muted);">Cargando fotografías del evento...</p>
        </div>

        <div style="text-align: center; margin-top: 2rem; margin-bottom: 2rem; max-width: 320px; margin-left: auto; margin-right: auto;">
            <button id="btn-load-more" class="btn-elegant" style="display: none;">
                Cargar más fotos
            </button>
        </div>
    </main>

    <!-- Modal para ver Foto + Comentarios -->
    <dialog id="photo-modal" class="modal-photo">
        <article class="modal-body" style="margin: 0;">
            <header class="modal-header-custom">
                <h4 id="modal-uploader">Foto de la boda</h4>
                <button type="button" aria-label="Cerrar" id="btn-close-modal" class="btn-close-modal">✕</button>
            </header>

            <div class="modal-img-container">
                <img id="modal-img" class="modal-img" src="#" alt="Fotografía ampliada">
            </div>

            <section style="margin-top: 1.2rem;">
                <!-- Formulario para publicar comentario (arriba) -->
                <form id="comment-form" class="comment-form-elegant" style="margin-bottom: 1.4rem; border: 1px solid rgba(201, 161, 90, 0.25); padding: 1rem 1.2rem;">
                    <div class="divider" style="margin: 0 0 1rem;"><span class="l"></span>Dejá tu comentario<span class="l"></span></div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label for="commentAuthor" class="field-label">Tu Nombre</label>
                            <input type="text" id="commentAuthor" name="authorName" class="field-elegant" placeholder="Ej: Primo Lucas" required maxlength="150" style="margin-bottom: 0;">
                        </div>
                        <div>
                            <label for="commentText" class="field-label">Comentario</label>
                            <input type="text" id="commentText" name="text" class="field-elegant" placeholder="¡Qué linda foto!" required maxlength="500" style="margin-bottom: 0;">
                        </div>
                    </div>

                    <button type="submit" id="btn-comment-submit" class="btn-primary-elegant" style="width: 100%; margin-top: 1.2rem; padding: 12px 20px; font-size: 0.9rem;">Enviar Comentario</button>
                    <div id="comment-status"></div>
                </form>

                <div class="divider"><span class="l"></span>Comentarios (<span id="modal-comments-count">0</span>)<span class="l"></span></div>

                <div id="modal-comments-list" style="max-height: 240px; overflow-y: auto; padding-right: 4px;">
                    <p style="color: var(--cream-muted);">Cargando comentarios...</p>
                </div>
            </section>
        </article>
    </dialog>

    <footer class="footer-note" style="margin-top: 2.5rem; padding-bottom: 1.5rem;">
        <small>✦ Celebrando el amor ✦</small>
    </footer>

    <script>
        const SLUG = 'marcos-y-priscila';
        let currentPage = 0;
        let activePhotoId = null;

        // Misma identidad de invitado que usa upload.html para las fotos: así el rate
        // limiting por guestToken (15 comentarios/min) es por invitado y no compartido.
        const GUEST_TOKEN_KEY = 'eventfoto_guest_token';
        function getOrCreateGuestToken() {
            let token = localStorage.getItem(GUEST_TOKEN_KEY);
            if (!token) {
                token = crypto.randomUUID();
                localStorage.setItem(GUEST_TOKEN_KEY, token);
            }
            return token;
        }
        const GUEST_TOKEN = getOrCreateGuestToken();

        document.addEventListener('DOMContentLoaded', () => {
            loadGalleryPage(0);

            document.getElementById('btn-load-more').addEventListener('click', () => {
                loadGalleryPage(currentPage + 1);
            });

            document.getElementById('btn-close-modal').addEventListener('click', () => {
                document.getElementById('photo-modal').close();
            });

            setupCommentForm();
        });

        // 1. Cargar página de la galería
        async function loadGalleryPage(page) {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/photos?page=${page}&size=12`);
                const data = await res.json();
                const container = document.getElementById('gallery-container');
                const btnMore = document.getElementById('btn-load-more');

                if (page === 0) container.innerHTML = '';

                if (!data.content || data.content.length === 0) {
                    if (page === 0) {
                        container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--cream-muted);"><em>Aún no hay fotografías en la galería pública. ¡Sé el primero en subir una!</em></p>';
                    }
                    btnMore.style.display = 'none';
                    return;
                }

                data.content.forEach(photo => {
                    let imageUrl = photo.url || photo.storageKey;
                    if (imageUrl && !imageUrl.startsWith('http') && !imageUrl.startsWith('/')) {
                        imageUrl = '/' + imageUrl;
                    }

                    const card = document.createElement('div');
                    card.className = 'gallery-card';
                    card.dataset.photoId = photo.id;
                    card.innerHTML = `
                        <div class="gallery-img-wrapper">
                            <img src="${escapeHtml(imageUrl)}" alt="Foto de la boda" onerror="handleImageError(this)">
                        </div>
                        <div class="gallery-card-footer">
                            <span class="badge-uploader"><i class="fa-solid fa-camera" style="font-size: 0.8rem;"></i> ${escapeHtml(photo.uploaderName || 'Invitado')}</span>
                            <span class="comments-count" id="count-${photo.id}"><i class="fa-solid fa-comments" style="font-size: 0.8rem;"></i> ${photo.commentCount || 0}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => openPhotoModal(photo));
                    container.appendChild(card);
                });

                currentPage = page;
                if (data.last) {
                    btnMore.style.display = 'none';
                } else {
                    btnMore.style.display = 'block';
                }

            } catch (err) {
                console.error('Error al cargar la galería:', err);
            }
        }

        // Manejo elegante si una foto previa en local o dev no está en el servidor
        function handleImageError(imgElem) {
            imgElem.onerror = null;
            // Usar la foto real de los novios de la boda como elegante fallback en vez de imágenes externas no deseadas
            imgElem.src = '/images/wedding_couple.png';
            imgElem.style.opacity = '0.85';
        }

        // 2. Abrir Modal de Foto + Comentarios
        async function openPhotoModal(photo) {
            activePhotoId = photo.id;
            const modal = document.getElementById('photo-modal');

            let imageUrl = photo.url || photo.storageKey;
            if (imageUrl && !imageUrl.startsWith('http') && !imageUrl.startsWith('/')) {
                imageUrl = '/' + imageUrl;
            }

            document.getElementById('modal-uploader').innerHTML = `Subida por ${escapeHtml(photo.uploaderName || 'Invitado')}`;

            const modalImg = document.getElementById('modal-img');
            modalImg.onerror = function() {
                this.onerror = null;
                this.src = '/images/wedding_couple.png';
            };
            modalImg.src = imageUrl;

            modal.showModal();
            loadComments(photo.id);
        }

        // 3. Cargar comentarios de una foto
        async function loadComments(photoId) {
            const listDiv = document.getElementById('modal-comments-list');
            const countSpan = document.getElementById('modal-comments-count');

            try {
                const res = await fetch(`/api/v1/photos/${photoId}/comments`);
                const comments = await res.json();

                const total = comments ? comments.length : 0;
                countSpan.innerText = total;

                const cardCountSpan = document.getElementById(`count-${photoId}`);
                if (cardCountSpan) {
                    cardCountSpan.innerText = `💬 ${total}`;
                }

                if (!comments || comments.length === 0) {
                    listDiv.innerHTML = '<p style="color: var(--cream-muted); font-style: italic;">No hay comentarios en esta foto. ¡Sé el primero en comentar!</p>';
                    return;
                }

                listDiv.innerHTML = comments.map(c => `
                    <div class="comment-item">
                        <strong>${escapeHtml(c.authorName)}</strong>
                        <p>${escapeHtml(c.text)}</p>
                    </div>
                `).join('');

            } catch (err) {
                listDiv.innerHTML = '<p style="color: #fca5a5;">Error al cargar comentarios.</p>';
            }
        }

        // 4. Formulario para agregar comentario
        function setupCommentForm() {
            document.getElementById('comment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!activePhotoId) return;

                const statusDiv = document.getElementById('comment-status');
                const btn = document.getElementById('btn-comment-submit');
                const authorName = document.getElementById('commentAuthor').value.trim();
                const text = document.getElementById('commentText').value.trim();

                if (!authorName || !text) return;

                try {
                    btn.disabled = true;
                    btn.innerText = 'Enviando...';

                    const res = await fetch(`/api/v1/photos/${activePhotoId}/comments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ authorName, text, guestToken: GUEST_TOKEN })
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.message || 'Tu comentario no pudo publicarse, revisá el contenido e intentá de nuevo.');
                    }

                    document.getElementById('commentText').value = '';
                    statusDiv.innerHTML = '<div class="alert-box alert-success" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac; padding: 10px; border-radius: 8px; margin-top: 10px;">¡Comentario publicado!</div>';
                    setTimeout(() => { statusDiv.innerHTML = ''; }, 4000);

                    loadComments(activePhotoId);
                } catch (err) {
                    statusDiv.innerHTML = `<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">${escapeHtml(err.message)}</div>`;
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Enviar Comentario';
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
