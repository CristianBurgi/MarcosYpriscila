<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Visitas | Boda de Marcos y Priscila</title>
    <!-- Google Fonts, FontAwesome & Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css?v=3">
    <link rel="stylesheet" href="/css/elegant-theme.css?v=1">
    <style>
        html, body {
            background: linear-gradient(to bottom, rgba(36, 10, 13, 0.86), rgba(16, 4, 5, 0.95)),
                        url('/images/wedding_couple.png?v=3') no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            color: var(--cream) !important;
            font-family: 'Cormorant Garamond', serif !important;
        }

        .header-section {
            text-align: center;
            padding: 2rem 1.25rem 0.5rem;
            max-width: 480px;
            margin: 0 auto;
        }

        .form-card-elegant {
            max-width: 420px;
            margin: 0 auto 2.5rem;
            padding: 1.6rem;
            border: 1px solid rgba(201, 161, 90, 0.3);
        }

        #message-form { text-align: center; }

        .field-elegant { text-align: center; }

        .message-card {
            background: rgba(201, 161, 90, 0.04);
            border-left: 2px solid var(--gold);
            padding: 1.1rem 1.3rem;
            margin-bottom: 1.1rem;
            overflow-wrap: anywhere;
        }

        .message-author {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.2rem;
            color: var(--cream);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .message-text {
            color: var(--cream-muted);
            font-size: 1.02rem;
            margin-top: 0.4rem;
            line-height: 1.45;
            font-family: 'Cormorant Garamond', serif;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .message-time {
            color: var(--gold-soft);
            font-size: 0.8rem;
            margin-top: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: .05em;
        }

        .messages-section {
            max-width: 620px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }
    </style>
</head>
<body>
    <header class="header-section">
        <a href="/menu.html" class="back-link-elegant"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
        <div class="ornament"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
        <h1 class="page-title">Libro de Visitas</h1>
        <p class="page-sub">Dejá tus buenos deseos para los novios</p>
    </header>

    <main>
        <article class="form-card-elegant">
            <div class="divider" style="margin-top: 0;"><span class="l"></span>Escribir un mensaje<span class="l"></span></div>

            <form id="message-form">
                <label for="authorName" class="field-label">Tu Nombre</label>
                <input type="text" id="authorName" name="authorName" class="field-elegant" placeholder="Ej: Padrino Juan" required maxlength="150">

                <label for="messageText" class="field-label">Mensaje para los novios</label>
                <textarea id="messageText" name="text" rows="3" class="field-elegant" placeholder="¡Les deseamos toda la felicidad y amor en esta nueva etapa juntos!" required maxlength="1000"></textarea>

                <button type="submit" id="btn-submit" class="btn-primary-elegant">
                    Enviar Mensaje
                </button>
            </form>
            <div id="status-message"></div>
        </article>

        <section class="messages-section">
            <div class="divider"><span class="l"></span>Felicitaciones de los invitados<span class="l"></span></div>
            <div id="messages-list">
                <p style="color: var(--cream-muted); text-align: center;">Cargando mensajes del libro de visitas...</p>
            </div>
        </section>
    </main>

    <footer class="footer-note" style="margin-top: 2.5rem; padding-bottom: 1.5rem;">
        <small>✦ Celebrando el amor ✦</small>
    </footer>

    <script>
        const SLUG = 'marcos-y-priscila';

        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            setupForm();
        });

        // 1. Cargar mensajes
        async function loadMessages() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/messages?page=0&size=100`);
                const data = await res.json();
                const container = document.getElementById('messages-list');

                if (!data.content || data.content.length === 0) {
                    container.innerHTML = '<p style="color: var(--cream-muted); font-style: italic; text-align: center;">Aún no hay mensajes. ¡Sé el primero en escribir a los novios!</p>';
                    return;
                }

                container.innerHTML = data.content.map(msg => `
                    <div class="message-card">
                        <div class="message-author">${escapeHtml(msg.authorName)}</div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <span class="message-time"><i class="fa-regular fa-clock" style="font-size: 0.75rem;"></i> ${new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} hs</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error al cargar mensajes:', err);
            }
        }

        // 2. Enviar nuevo mensaje
        function setupForm() {
            document.getElementById('message-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                const statusDiv = document.getElementById('status-message');
                const btn = document.getElementById('btn-submit');
                const authorName = document.getElementById('authorName').value.trim();
                const text = document.getElementById('messageText').value.trim();

                if (!authorName) {
                    statusDiv.innerHTML = '<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">Por favor ingresá tu nombre. Es obligatorio.</div>';
                    return;
                }

                if (!text) {
                    statusDiv.innerHTML = '<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">Por favor escribí un mensaje.</div>';
                    return;
                }

                try {
                    btn.disabled = true;
                    btn.innerText = 'Enviando...';

                    const res = await fetch(`/api/v1/events/${SLUG}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ authorName, text })
                    });

                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.message || 'Error al enviar el mensaje.');
                    }

                    statusDiv.innerHTML = '<div class="alert-box alert-success" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac; padding: 10px; border-radius: 8px; margin-top: 10px;">¡Mensaje enviado con éxito a los novios! <i class="fa-solid fa-heart" style="color: #f472b6;"></i></div>';
                    document.getElementById('messageText').value = '';

                    setTimeout(() => { statusDiv.innerHTML = ''; }, 5000);

                    loadMessages();

                } catch (err) {
                    statusDiv.innerHTML = `<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">${escapeHtml(err.message)}</div>`;
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Enviar Mensaje';
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
