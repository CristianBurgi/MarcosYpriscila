<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Visitas | Boda de Marcos y Priscila</title>
    <!-- Google Fonts, FontAwesome & Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css?v=3">
    <style>
        html, body {
            background: linear-gradient(to bottom, rgba(52, 9, 18, 0.82), rgba(20, 3, 7, 0.94)),
                        url('/images/wedding_couple.png?v=3') no-repeat center center fixed !important;
            background-size: cover !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            color: #fdf6f7 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .header-section {
            text-align: center;
            padding: 2.5rem 1.25rem 1rem;
        }

        .wedding-title-main {
            font-family: 'Playfair Display', 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 600;
            color: #fdf6f7;
            margin-bottom: 0.25rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: #e2c2c6;
            margin: 0.4rem auto 1.5rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #e6c594;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            padding: 6px 14px;
            background: rgba(59, 10, 20, 0.6);
            border: 1px solid rgba(247, 225, 228, 0.2);
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            background: rgba(140, 43, 62, 0.6);
            text-decoration: none;
        }

        .card-glass {
            background: rgba(59, 10, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 1.5rem;
            border: 1px solid rgba(247, 225, 228, 0.22);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 2rem;
        }

        .message-card {
            background: rgba(35, 6, 12, 0.75);
            padding: 1.25rem 1.4rem;
            border-left: 4px solid #8c2b3e;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(247, 225, 228, 0.15);
            border-right: 1px solid rgba(247, 225, 228, 0.15);
            border-bottom: 1px solid rgba(247, 225, 228, 0.15);
        }

        .message-author {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #fdf6f7;
            font-weight: 600;
        }

        .message-text {
            color: #e2c2c6;
            font-size: 1rem;
            margin-top: 0.4rem;
            line-height: 1.45;
        }

        .message-time {
            color: #e6c594;
            font-size: 0.82rem;
            margin-top: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-burgundy-full {
            background: linear-gradient(135deg, #6b1c2d 0%, #521321 100%);
            border: 1px solid rgba(247, 225, 228, 0.25);
            color: #fdf6f7;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-burgundy-full:hover {
            background: linear-gradient(135deg, #8c2b3e 0%, #6b1c2d 100%);
            box-shadow: 0 4px 16px rgba(140, 43, 62, 0.4);
        }

        .footer-wedding {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            color: #e2c2c6;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header class="container header-section">
        <a href="/menu.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
        <h1 class="wedding-title-main">
            <i class="fa-solid fa-book-open-reader" style="color: #e6c594;"></i> Libro de Visitas
        </h1>
        <p class="welcome-subtitle">Dejá tus buenos deseos para Marcos y Priscila</p>
    </header>

    <main class="container" style="max-width: 750px; margin: 0 auto; padding: 0 1.25rem;">
        <article class="card-glass">
            <h3 style="font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #fdf6f7; margin-bottom: 1.2rem;"><i class="fa-solid fa-pen-nib" style="color: #e6c594; margin-right: 6px;"></i> Escribir un Mensaje</h3>
            
            <form id="message-form">
                <label for="authorName" style="color: #fdf6f7; font-weight: 500;">Tu Nombre <span style="color: #fca5a5;">*</span>:</label>
                <input type="text" id="authorName" name="authorName" placeholder="Ej: Padrino Juan" required maxlength="150" style="background: rgba(20, 3, 7, 0.7); color: #fff; border: 1px solid rgba(247, 225, 228, 0.3); border-radius: 10px; margin-bottom: 1rem;">

                <label for="messageText" style="color: #fdf6f7; font-weight: 500;">Mensaje para los novios <span style="color: #fca5a5;">*</span>:</label>
                <textarea id="messageText" name="text" rows="3" placeholder="¡Les deseamos toda la felicidad y amor en esta nueva etapa juntos!" required maxlength="1000" style="background: rgba(20, 3, 7, 0.7); color: #fff; border: 1px solid rgba(247, 225, 228, 0.3); border-radius: 10px; margin-bottom: 1.2rem;"></textarea>

                <button type="submit" id="btn-submit" class="btn-burgundy-full">
                    Enviar Mensaje
                </button>
            </form>
            <div id="status-message"></div>
        </article>

        <section style="margin-top: 2rem;">
            <h3 style="font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #fdf6f7; margin-bottom: 1.2rem;"><i class="fa-solid fa-comments" style="color: #e6c594; margin-right: 6px;"></i> Felicitaciones de los Invitados</h3>
            <div id="messages-list">
                <p style="color: #e2c2c6;">Cargando mensajes del libro de visitas...</p>
            </div>
        </section>
    </main>

    <footer class="footer-wedding">
        <small>✦ Boda de Marcos y Priscila &bull; Celebrando el amor ✦</small>
    </footer>

    <script>
        const SLUG = 'marcos-y-priscila';

        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            setupForm();
        });

        // 1. Cargar mensajes
        async function loadMessages() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}/messages?page=0&size=100`);
                const data = await res.json();
                const container = document.getElementById('messages-list');

                if (!data.content || data.content.length === 0) {
                    container.innerHTML = '<p style="color: #e2c2c6; font-style: italic;">Aún no hay mensajes. ¡Sé el primero en escribir a los novios!</p>';
                    return;
                }

                container.innerHTML = data.content.map(msg => `
                    <div class="message-card">
                        <div class="message-author">${escapeHtml(msg.authorName)}</div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <span class="message-time"><i class="fa-regular fa-clock" style="font-size: 0.8rem;"></i> ${new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} hs</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error al cargar mensajes:', err);
            }
        }

        // 2. Enviar nuevo mensaje
        function setupForm() {
            document.getElementById('message-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                const statusDiv = document.getElementById('status-message');
                const btn = document.getElementById('btn-submit');
                const authorName = document.getElementById('authorName').value.trim();
                const text = document.getElementById('messageText').value.trim();

                if (!authorName) {
                    statusDiv.innerHTML = '<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">Por favor ingresá tu nombre. Es obligatorio.</div>';
                    return;
                }

                if (!text) {
                    statusDiv.innerHTML = '<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">Por favor escribí un mensaje.</div>';
                    return;
                }

                try {
                    btn.disabled = true;
                    btn.innerText = 'Enviando...';

                    const res = await fetch(`/api/v1/events/${SLUG}/messages`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ authorName, text })
                    });

                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.message || 'Error al enviar el mensaje.');
                    }

                    statusDiv.innerHTML = '<div class="alert-box alert-success" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac; padding: 10px; border-radius: 8px; margin-top: 10px;">¡Mensaje enviado con éxito a los novios! <i class="fa-solid fa-heart" style="color: #f472b6;"></i></div>';
                    document.getElementById('messageText').value = '';

                    setTimeout(() => { statusDiv.innerHTML = ''; }, 5000);

                    loadMessages();

                } catch (err) {
                    statusDiv.innerHTML = `<div class="alert-box alert-error" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px; border-radius: 8px; margin-top: 10px;">${escapeHtml(err.message)}</div>`;
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Enviar Mensaje';
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
