spring:
  application:
    name: eventfoto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/eventfoto_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres_local_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fase 8 - Test 10 (degradacion de infraestructura): con el default de 10
      # (sin configurar), 50 confirmUpload concurrentes se encolaban en oleadas
      # de a 10 cada ~9s, llegando la ultima oleada a esperar 30+ segundos.
      # Subimos el techo a 20 para dar mas margen de concurrencia real de boda.
      maximum-pool-size: 20
      # No hace falta bajarlo agresivamente: con los timeouts explicitos del
      # S3Client (ver S3Config.java), una conexion ya no queda retenida ~9s
      # esperando a R2 -- el peor caso ahora es de pocos segundos.
      connection-timeout: 15000

  jpa:
    # Fase 9.1 Bloque 3: open-in-view en false a propósito. Con true (el default), la sesión de
    # Hibernate queda atada a la request entera y la primera consulta (ej. la resolución del
    # evento en EventAccessInterceptor) toma una conexión del pool que NO se devuelve hasta que
    # termina la request: medido con ZipConnectionPoolTest, 1 conexión retenida durante todo el
    # streaming de un ZIP aunque ninguna transacción siga abierta. Con varios organizadores
    # bajando álbumes a la vez agota el pool (maximum-pool-size: 20). Con false la conexión se
    # devuelve al cerrar cada transacción; todo acceso lazy tiene que ocurrir dentro de una.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # Mismo tope que /confirm (app.upload.max-file-bytes): los dos caminos de subida coinciden.
      max-file-size: ${app.upload.max-file-bytes:15728640}
      # Un poco más que el archivo: el request lleva además uploaderName, guestToken y el overhead multipart.
      max-request-size: 16MB

app:
  # Única fuente de URLs absolutas (QR, links del panel). En producción se setea en
  # Railway; con STORAGE_MODE=r2 la app no arranca si queda apuntando a localhost.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload:
    # Tope de tamaño por archivo (15 MB). Lo aplica /confirm (HeadObject sobre lo que el cliente subió directo a R2,
    # antes de leer un solo byte) y /upload-direct; spring.servlet.multipart.max-file-size usa este mismo valor.
    max-file-bytes: 15728640
  event:
    # Tope de SEGURIDAD de fotos por evento (no un límite de plan): frena el abuso aun con "sin límite por invitado".
    # Cuenta las fotos persistidas (borrar libera lugar). Es un tope blando: ver GuestQuotaService.assertEventHasRoom.
    max-photos: 5000
  guest-quota:
    # Límite de fotos por invitado de los eventos NUEVOS (cada evento guarda el suyo en events.max_photos_per_guest;
    # el organizador lo pasa a "sin límite" desde el panel). VIGENTE: default-max-photos-per-guest. La propiedad
    # vieja max-photos-per-guest sigue funcionando como fallback, pero está deprecada. Es el único lugar donde vive el 24.
    default-max-photos-per-guest: ${app.guest-quota.max-photos-per-guest:24}
  checkout:
    # Fase 9.3: compra con Mercado Pago (Checkout Pro). Apagado por defecto: sin rutas y sin credenciales requeridas.
    # Prendido, exige MP_ACCESS_TOKEN y un precio > 0 (si no, la app no arranca). Credenciales de PRUEBA hasta la L6.
    enabled: ${CHECKOUT_ENABLED:false}
    price-ars: ${CHECKOUT_PRICE_ARS:50000}
    mp-access-token: ${MP_ACCESS_TOKEN:}
  storage:
    mode: ${STORAGE_MODE:local} # 'local' para desarrollo local en disco, 'r2' para producción en Railway

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY:r2_placeholder_access_key}
    secret-key: ${R2_SECRET_KEY:r2_placeholder_secret_key}
    bucket-name: ${R2_BUCKET:eventfoto-bucket}
    endpoint: ${R2_ENDPOINT:https://<account-id>.r2.cloudflarestorage.com}
    public-url: ${R2_PUBLIC_URL:}

# Configuración de Autenticación y JWT
security:
  # Superadmin (fase 9.1 Bloque 1): credenciales por variable de entorno, sin fila en BD.
  superadmin:
    email: ${SUPERADMIN_EMAIL:superadmin@eventfoto.com.ar}
    password: ${SUPERADMIN_PASSWORD:admin123}
    jwt:
      expiration-ms: ${SUPERADMIN_JWT_EXPIRATION_MS:7200000} # 2 horas -- sin tokenVersion que revisar en BD, la única defensa es una sesión corta
  jwt:
    secret: ${JWT_SECRET:very_secret_jwt_key_that_is_at_least_256_bits_long_for_security_reasons}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas (28,800,000 ms) -- organizador

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# Observabilidad de errores: sin SENTRY_DSN, el SDK queda en modo no-op (no rompe nada).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: 0.0 # solo error tracking, sin performance monitoring en esta fase

server:
  port: ${PORT:8080}
  tomcat:
    # Fase 9.0: cuando una subida supera los 30MB, Tomcat descarta ("swallow") el resto
    # del body para poder entregar la respuesta 413 con el mensaje para el invitado. Con
    # el default (2MB) cierra la conexión y el navegador ve un error de red genérico.
    max-swallow-size: 64MB

