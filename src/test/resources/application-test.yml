spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

app:
  demo:
    # DemoCleanupJob no corre solo en los tests (los tests llaman a la limpieza a mano); ver el comentario en el job.
    cleanup-initial-delay-ms: 86400000
  mail:
    # Mails en el mismo hilo (MailExecutor): un envío de un test no cae en las verificaciones del siguiente.
    async: false
  checkout:
    # Prendido en los tests para que las rutas del checkout entren en AdminRouteEnumerationTest y los tests de
    # aislamiento del panel; los tests del interruptor apagado lo pisan. El token es falso: el cliente de MP se mockea.
    enabled: true
    price-ars: 50000
    mp-access-token: TEST-token-falso-solo-para-tests
    mp-webhook-secret: secreto-webhook-falso-solo-para-tests
    webhook-unknown-payment-retry-ms: 10
  storage:
    mode: local

cloudflare:
  r2:
    bucket-name: test-bucket
    endpoint: http://localhost:8080

security:
  superadmin:
    email: superadmin@boda.com
    password: admin123
    jwt:
      expiration-ms: 7200000
  jwt:
    secret: super_secret_jwt_key_minimo_32_caracteres_123456
    expiration-ms: 28800000
