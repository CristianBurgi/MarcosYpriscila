<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento | Menú Principal</title>
    <!-- Google Fonts, FontAwesome & Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css?v=3">
    <link rel="stylesheet" href="/css/elegant-theme.css?v=1">
    <style>
        html, body {
            background: linear-gradient(to bottom, #240a0d, #100405) fixed !important;
            background-size: cover !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            color: var(--cream) !important;
            font-family: 'Cormorant Garamond', serif !important;
        }

        .hero-header {
            text-align: center;
            padding: 2.8rem 1.25rem 0.5rem;
            max-width: 480px;
            margin: 0 auto;
            animation: fadeInDown 0.8s ease-out;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: var(--cream-muted);
            max-width: 460px;
            margin: 0 auto 0.5rem;
            line-height: 1.5;
            font-style: italic;
        }

        .menu-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 1rem 1.25rem 0;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="/js/event-context.js"></script>
<link rel="stylesheet" href="/css/event-branding.css?v=1">
<style id="event-palette">:root{--brand-primary:#7b2d8e;--brand-primary-deep:#381441;--brand-primary-light:#ede7ee;--brand-secondary:#975da5;--brand-on-primary:#FFFFFF;--brand-on-secondary:#FFFFFF;--gold:#ede7ee;--gold-soft:#ede7ee;--accent-rgb:237, 231, 238;--brand-bg:url("/uploads/events/{EVENT_ID}/branding/11111111-2222-4333-8444-555555555555.jpg") center/cover no-repeat;}</style>
</head>
<body>

    <!-- Header Elegante -->
    <header class="hero-header">
        <div class="ornament"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
        <h1 class="names" id="event-name">&nbsp;</h1>
        <div class="subtitle" id="event-date"></div>
        <p class="welcome-subtitle">¡Bienvenidos! Elegí una opción:</p>
    </header>

    <!-- Menú Principal -->
    <main class="menu-container">
        <div class="divider"><span class="l"></span>Elegí una opción<span class="l"></span></div>

        <a href="#" data-event-path="/subir" class="btn-elegant" id="upload-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="#e6cfa0" stroke-width="1.3"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.2"/></svg>
            Subir Foto
        </a>
        <p id="upload-desc" style="text-align: center; font-size: 0.8rem; color: var(--cream-muted); margin: -6px 0 14px;"></p>

        <a href="#" data-event-path="/album" class="btn-elegant">
            <svg viewBox="0 0 24 24" fill="none" stroke="#e6cfa0" stroke-width="1.3"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>
            Ver Álbum
        </a>

        <a href="#" data-event-path="/mensajes" class="btn-elegant">
            <svg viewBox="0 0 24 24" fill="none" stroke="#e6cfa0" stroke-width="1.3"><path d="M12 20s-7-4.4-9.3-8.6C1.2 8 2.6 5 5.7 5c1.8 0 3.2 1 4.3 2.6C11.1 6 12.5 5 14.3 5c3.1 0 4.5 3 3 6.4C15 15.6 12 20 12 20z"/></svg>
            Libro de Visitas
        </a>
    </main>

    <script>
        const SLUG = window.EVENT_SLUG;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}`);
                if (res.ok) {
                    const eventData = await res.json();
                    if (eventData && eventData.uploadStatus && eventData.uploadStatus !== 'OPEN') {
                        const uploadDesc = document.getElementById('upload-desc');
                        if (uploadDesc) {
                            uploadDesc.innerHTML = '🔒 <span style="color: #fca5a5; font-weight: 600;"></span>';
                            uploadDesc.querySelector('span').textContent = eventData.uploadMessage;
                        }
                    }
                }
            } catch (e) {
                console.warn('Error verificando estado del evento:', e);
            }
        });

        // Completa el encabezado (nombre del evento y fecha) dinámicamente desde
        // GET /api/v1/events/{slug}, en vez de mantenerlo hardcodeado en el HTML.
        loadEventHeader();

        async function loadEventHeader() {
            try {
                const res = await fetch(`/api/v1/events/${SLUG}`);
                if (!res.ok) return;
                const eventData = await res.json();

                const namesEl = document.getElementById('event-name');
                if (namesEl && eventData.name) {
                    namesEl.textContent = eventData.name;
                }

                const dateEl = document.getElementById('event-date');
                if (dateEl && eventData.eventDate) {
                    const formatted = formatEventDateForDisplay(eventData.eventDate);
                    if (formatted) dateEl.textContent = formatted;
                }
            } catch (e) {
                console.warn('No se pudo cargar el encabezado dinámico del evento:', e);
            }
        }

        function formatEventDateForDisplay(isoDate) {
            try {
                // "2026-12-12" sola se lee como medianoche UTC (el 11 a la noche en Argentina): se fija la hora local.
                const date = new Date(isoDate + 'T00:00:00');
                const day = date.getDate();
                const month = date.toLocaleDateString('es-AR', { month: 'long' });
                const year = date.getFullYear();
                const monthCapitalized = month.charAt(0).toUpperCase() + month.slice(1);
                return `${day} · ${monthCapitalized} · ${year}`;
            } catch (e) {
                return '';
            }
        }
    </script>
</body>
</html>
